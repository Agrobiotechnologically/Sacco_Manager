<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b2822" />
    <meta name="description" content="A modern SACCO management workspace for members, savings, shares, loans and reports." />
    <title>Umoja SACCO </title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
      <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M20 8V5a2 2 0 0 0-2-2H5a3 3 0 0 0 0 6h15v12H5a3 3 0 0 1-3-3V6"/><path d="M16 14h.01"/></symbol>
      <symbol id="i-trending" viewBox="0 0 24 24"><path d="m22 7-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/></symbol>
      <symbol id="i-landmark" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7M4 10h16M5 10v9m4-9v9m6-9v9m4-9v9M3 22h18M3 19h18"/></symbol>
      <symbol id="i-receipt" viewBox="0 0 24 24"><path d="M4 2v20l4-2 4 2 4-2 4 2V2l-4 2-4-2-4 2-4-2Z"/><path d="M8 9h8M8 13h8"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-5 5"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14m-7-7h14"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M7 17 17 7M7 7h10v10"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m18 6-12 12M6 6l12 12"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/></symbol>
      <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 7h16M7 12h10m-7 5h4"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></symbol>
    </svg>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#" aria-label="Umoja SACCO home">
          <span class="brand-mark"><svg class="icon"><use href="#i-landmark"/></svg></span>
          <span class="brand-copy"><strong>umoja<span>.</span></strong><small>SACCO MANAGEMENT</small></span>
        </a>
        <button class="workspace-label workspace-home" type="button" data-view="dashboard">WORKSPACE</button>
        <nav class="main-nav" aria-label="Main navigation">
          <button class="nav-link active" data-view="dashboard"><svg class="icon"><use href="#i-grid"/></svg><span>Overview</span></button>
          <button class="nav-link" data-view="members"><svg class="icon"><use href="#i-users"/></svg><span>Members</span><span class="nav-count" id="member-count">0</span></button>
          <button class="nav-link" data-view="savings"><svg class="icon"><use href="#i-wallet"/></svg><span>Savings</span></button>
          <button class="nav-link" data-view="shares"><svg class="icon"><use href="#i-trending"/></svg><span>Share capital</span></button>
          <button class="nav-link" data-view="loans"><svg class="icon"><use href="#i-landmark"/></svg><span>Loans</span><span class="nav-dot"></span></button>
          <button class="nav-link" data-view="repayments"><svg class="icon"><use href="#i-receipt"/></svg><span>Repayments</span></button>
          <div class="nav-separator"></div>
          <div class="workspace-label">INSIGHTS</div>
          <button class="nav-link" data-view="reports"><svg class="icon"><use href="#i-chart"/></svg><span>Reports</span></button>
        </nav>
        <div class="sidebar-bottom">
          <div class="help-card"><span class="help-orb">✳</span><strong>Need a hand?</strong><p>Your SACCO workspace, all in one place.</p><button type="button" id="help-button">Explore quick guide <span>→</span></button></div>
          <div class="sidebar-tools"><button id="theme-toggle" type="button" data-action="toggle-theme">Switch to dark theme</button><button type="button" data-action="reset-data">Reset all data</button></div>
          <button class="profile-button" id="profile-button">
            <span class="avatar avatar-green">J</span>
            <span class="profile-copy"><strong>Josh</strong><small>Administrator</small></span>
            <svg class="icon profile-more"><use href="#i-more"/></svg>
          </button>
        </div>
      </aside>
      <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
      <main class="main-area">
        <header class="topbar">
          <button class="icon-button mobile-menu" id="mobile-menu" aria-label="Open navigation"><svg class="icon"><use href="#i-menu"/></svg></button>
          <div class="breadcrumb"><span>Workspace</span><span class="crumb-slash">/</span><strong id="breadcrumb-current">Overview</strong></div>
          <div class="topbar-actions">
            <div class="search-wrap"><button class="search-trigger" id="search-trigger" type="button" aria-label="Focus search"><svg class="icon"><use href="#i-search"/></svg></button><input type="search" id="global-search" placeholder="Search everything..." aria-label="Search members, loans, and transactions" autocomplete="off"/><kbd>⌘ K</kbd><div class="search-results" id="global-search-results" role="listbox" aria-label="Search results" hidden></div></div>
            <button class="icon-button notification-button" id="notification-button" aria-label="Notifications"><svg class="icon"><use href="#i-bell"/></svg><span class="notification-dot"></span></button>
            <span class="topbar-divider"></span>
            <button class="period-button"><svg class="icon"><use href="#i-calendar"/></svg><span>Sep 2026</span><span class="period-chevron">⌄</span></button>
          </div>
        </header>
        <section class="page-content" id="page-content" aria-live="polite"></section>
        <footer class="site-credit">Powered by <a href="https://agrobiotechnologically.github.io/CYBERSPACE1O1/" target="_blank" rel="noopener noreferrer">CYBERSPACE1O1</a></footer>
      </main>
    </div>
    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
    <dialog class="app-dialog" id="app-dialog" aria-labelledby="dialog-title"></dialog>
  </body>
</html>
